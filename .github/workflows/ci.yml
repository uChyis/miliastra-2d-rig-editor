name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安装 pnpm
        run: npm i -g pnpm@12
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 类型检查与构建
        run: pnpm build
